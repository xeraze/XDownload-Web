<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="XDownload — скачивай видео и аудио из 13 сервисов прямо в Telegram." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        var m = new Date(Date.now() + 10800000);
        var d = m.getUTCDay();
        var t = m.getUTCHours() * 60 + m.getUTCMinutes();
        var close = d === 5 || d === 6 ? 1290 : 1260;
        document.documentElement.dataset.theme =
          t < 420 ? "night" : t < 540 ? "morning" : t < close ? "day" : "night";
      })();
    </script>
    <title>XDownload</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
