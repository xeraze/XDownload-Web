    <script>
      (function () {
        var m = new Date(Date.now() + 10800000);
        var d = m.getUTCDay();
        var t = m.getUTCHours() * 60 + m.getUTCMinutes();
        var close = d === 5 || d === 6 ? 1290 : 1260;
        document.documentElement.dataset.theme =
          t < 360 ? "night" : t < 540 ? "morning" : t < close ? "day" : "night";
      })();
    </script>
